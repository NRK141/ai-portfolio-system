portfolio:
  name: "Full AI-Anchor PIT Q Screener"
  benchmark: "SPY"
  total_equity_positions: 15
  equity_weight: 0.60
  ranking_frequency: "Q"

  anchors:
    - ASML
    - MU
    - TSM
    - NVDA
    - GOOG
    - META

  diversifiers:
    IAU: 0.10
    SLV: 0.075
    ICOP: 0.075
    VXUS: 0.15

  fallback_mega_caps:
    - NVDA
    - MSFT
    - AAPL
    - AMZN
    - GOOG
    - GOOGL
    - META
    - AVGO
    - TSM
    - TSLA
    - BRK-B
    - LLY
    - JPM
    - WMT
    - V
    - ORCL
    - MA
    - XOM
    - JNJ
    - COST
    - HD
    - PG
    - NFLX
    - ASML
    - MU
    - AMD

data:
  # LIVE screener default:
  # Use StockAnalysis for today's ranking. If it fails, fall back to WRDS PIT.
  use_live_market_caps_for_screener: true
  live_market_cap_source: "stockanalysis"
  live_market_cap_url: "https://stockanalysis.com/list/biggest-companies/"
  live_market_caps_cache_path: "screener/data/live_market_caps_stockanalysis.csv"
  live_market_caps_cache_max_age_hours: 12
  fall_back_to_pit_on_live_failure: true

  # Local WRDS/CRSP-derived PIT market-cap file. Private; do not commit.
  point_in_time_market_caps_path: "data/raw/point_in_time_market_caps.csv"

  # Used only for downloading current prices for ranking candidates.
  candidate_top_n: 125

  # Warn if PIT fallback data is older than this many calendar days.
  stale_rank_data_days: 45

execution:
  # Fractional targets are the correct default for small portfolios.
  whole_shares: false
  min_trade_dollars: 25.0

risk:
  stock_hard_trigger: 0.10
  stock_hard_trim_to: 0.07

  diversifier_hard_triggers:
    IAU: 0.20
    SLV: 0.20
    ICOP: 0.20
    VXUS: 0.25

  diversifier_hard_trim_to:
    IAU: 0.15
    SLV: 0.15
    ICOP: 0.15
    VXUS: 0.18

  direct_semi_tickers:
    - ASML
    - MU
    - TSM
    - NVDA
    - AVGO
    - AMD

  ai_platform_tickers:
    - GOOG
    - META
    - MSFT
    - AMZN
    - AAPL

  direct_semi_soft_alert: 0.35
  direct_semi_hard_alert: 0.38
  total_ai_soft_alert: 0.50
  total_ai_hard_alert: 0.55
  diversifier_min_review: 0.35

share_class_rules:
  # Avoid duplicate Alphabet exposure. GOOG is preferred because it is an anchor.
  alphabet_preferred: "GOOG"
  alphabet_alternates:
    - "GOOGL"

outputs:
  output_dir: "outputs/screener"
